---
# Error reporting. The API key is an application secret: it lives in Rails
# encrypted credentials under `honeybadger_api_key`, not in source or in an
# environment variable. Without a key, notices are logged and dropped.
api_key: <%= Rails.application.credentials.honeybadger_api_key %>

# Report exceptions from deployed environments only; development and test use
# Honeybadger's null backend, so no network calls leave a local process.
development_environments:
  - development
  - test
  - cucumber

# Local environments never report, even with a key provisioned. Otherwise every
# rescued exception in development would log a delivery attempt. Keep local
# errors on Rails' error pages and logs.
development:
  exceptions.enabled: false
test:
  exceptions.enabled: false

# This application reports errors, not performance events.
insights:
  enabled: false
