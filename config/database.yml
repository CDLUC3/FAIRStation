# FAIR Station owns these databases. Never point them at RAMS.
#
# One engine everywhere: development, test, CI, and the deployed RDS instance
# all run MySQL 8.4. Local development uses the server defined in compose.yml,
# so SQL mode, collation, and column behavior match deployment.
#
# Deployment supplies the non-secret coordinates below and RAILS_MASTER_KEY.
# The database password lives in Rails encrypted credentials, not in an
# environment variable.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", "3306") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "root" } %>

development:
  <<: *default
  database: fair_station_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: fair_station_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "fair_station") %>
  password: <%= Rails.application.credentials.dig(:database, :password) %>
