# FAIR Station owns these databases. Never point them at RAMS.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production never uses local SQLite storage. Build-time asset compilation does
# not connect to a database; runtime requires either a MySQL URL or all fields.
production:
  adapter: mysql2
  encoding: utf8mb4
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
<% if Rails.env.production? && !ENV["SECRET_KEY_BASE_DUMMY"] %>
<% if ENV["DATABASE_URL"].present? %>
<% raise "DATABASE_URL must use mysql2:// in production" unless ENV["DATABASE_URL"].start_with?("mysql2://") %>
  url: <%= ENV.fetch("DATABASE_URL").to_json %>
<% else %>
  host: <%= ENV.fetch("DATABASE_HOST").to_json %>
  port: <%= ENV.fetch("DATABASE_PORT").to_json %>
  database: <%= ENV.fetch("DATABASE_NAME").to_json %>
  username: <%= ENV.fetch("DATABASE_USERNAME").to_json %>
  password: <%= ENV.fetch("DATABASE_PASSWORD").to_json %>
<% end %>
<% end %>
