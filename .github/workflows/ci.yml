name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request policy
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const sameRepository = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const promotion = pr.base.ref === 'main' && sameRepository && pr.head.ref === 'development';
            let release = false;
            if (pr.base.ref === 'main' && sameRepository &&
                pr.head.ref === 'release-please--branches--main' &&
                pr.user.type === 'Bot' && pr.user.login.endsWith('[bot]')) {
              if (!/^\d+$/.test(process.env.RELEASE_APP_ID || '')) {
                core.setFailed('Configure RELEASE_APP_ID to verify the release PR author.');
                return;
              }
              const slug = pr.user.login.slice(0, -5);
              const { data: app } = await github.rest.apps.getBySlug({ app_slug: slug });
              release = String(app.id) === process.env.RELEASE_APP_ID;
            }
            if (pr.base.ref === 'main' && !promotion && !release) {
              core.setFailed('main accepts only development promotions or release PRs from the configured GitHub App.');
              return;
            }
            if (!/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: \S[^\r\n]*$/.test(pr.title)) {
              core.setFailed('Use a Conventional Commit PR title, for example: feat: add dataset search.');
              return;
            }
            if (promotion || release) {
              core.notice('Merge this PR with a merge commit; never squash development into main.');
            }

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install MySQL client build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run baseline checks
        run: bin/ci
