name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check pull request policy
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const ancestry = [];
            const visited = new Set([pr.head.ref]);
            let base = pr.base.ref;
            while (base !== 'main') {
              if (visited.has(base)) {
                core.setFailed('Pull request dependencies must not form a cycle.');
                return;
              }
              visited.add(base);
              const parents = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                head: `${context.repo.owner}:${base}`,
                per_page: 100
              });
              const parent = parents.find(candidate =>
                candidate.head.repo?.full_name === pr.base.repo.full_name &&
                candidate.base.repo?.full_name === pr.base.repo.full_name &&
                candidate.head.ref === base
              );
              if (!parent) {
                core.setFailed('Dependent PRs need an open same-repository chain back to main.');
                return;
              }
              ancestry.push(parent.number);
              base = parent.base.ref;
            }
            if (ancestry.length) {
              core.notice(`Stacked through ${ancestry.map(number => `#${number}`).join(' → ')}; retarget to main before merging.`);
            }
            if (!/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: \S[^\r\n]*$/.test(pr.title)) {
              core.setFailed('Use a Conventional Commit PR title, for example: feat: add dataset search.');
              return;
            }
            core.notice('Squash and merge.');

  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fair_station_development
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          bundler-cache: true

      - name: Run baseline checks
        run: bin/ci
